name: Release

# Actions 页面点击 "Run workflow" 手动触发:构建编译产物并自动发布 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      make_release:
        description: '同时创建 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 框架依赖版:体积小,需已安装 .NET 9 桌面运行时
      - name: Publish (framework-dependent)
        run: dotnet publish LocalChat/LocalChat.csproj -c Release -r win-x64 --self-contained false -o publish/fx

      # 便携版:自包含单文件 exe,无需安装运行时
      - name: Publish (self-contained single-file)
        run: >
          dotnet publish LocalChat/LocalChat.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish/sc

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          Compress-Archive -Path publish/fx/* -DestinationPath "LocalChat-$v-win-x64.zip"
          Compress-Archive -Path publish/sc/LocalChat.exe -DestinationPath "LocalChat-$v-win-x64-portable.zip"

      # 即使不发布 Release,也能在本次运行的 Summary 里下载产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-${{ inputs.version }}
          path: |
            *.zip
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: LocalChat ${{ inputs.version }}
          body: |
            本地聊天 ${{ inputs.version }}

            - `LocalChat-*-win-x64.zip`:依赖 .NET 9 桌面运行时(x64)
            - `LocalChat-*-win-x64-portable.zip`:自包含单文件,解压即用,无需安装运行时
          files: |
            LocalChat-*-win-x64.zip
            LocalChat-*-win-x64-portable.zip
