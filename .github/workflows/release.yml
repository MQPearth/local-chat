name: Release

# Actions 页面点击 "Run workflow" 手动触发:一次运行同时产出 Windows 桌面端与 Android 端编译产物,并可选发布 Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      make_release:
        description: '同时创建 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # ---------- Windows 桌面端(WPF / .NET 9) ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 框架依赖版:体积小,需已安装 .NET 9 桌面运行时
      - name: Publish (framework-dependent)
        run: dotnet publish LocalChat/LocalChat.csproj -c Release -r win-x64 --self-contained false -o publish/fx

      # 便携版:自包含单文件 exe,无需安装运行时
      - name: Publish (self-contained single-file)
        run: >
          dotnet publish LocalChat/LocalChat.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish/sc

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          Compress-Archive -Path publish/fx/* -DestinationPath "LocalChat-$v-win-x64.zip"
          Compress-Archive -Path publish/sc/LocalChat.exe -DestinationPath "LocalChat-$v-win-x64-portable.zip"

      # 即使不发布 Release,也能在本次运行的 Summary 里下载产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-${{ inputs.version }}-win-x64
          path: |
            *.zip
          if-no-files-found: error

  # ---------- Android 端(Gradle / Kotlin) ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库未提交 gradlew,安装与 wrapper 声明一致的 Gradle 版本
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 从 Secrets 还原签名密钥(ANDROID_KEYSTORE_BASE64 等四个),未配置时产出未签名包
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/localchat-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "KEYSTORE_FILE=$KS"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::未配置签名 Secrets(ANDROID_KEYSTORE_BASE64 等),release APK 将为未签名包"
          fi

      # debug 版:自动用调试密钥签名,可直接安装;release 版:混淆优化,有密钥时自动签名
      - name: Build APKs
        working-directory: LocalChat-Android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          v="${{ inputs.version }}"
          mkdir -p apk
          cp LocalChat-Android/app/build/outputs/apk/debug/app-debug.apk "LocalChat-$v-android-debug.apk"
          rel="LocalChat-Android/app/build/outputs/apk/release"
          if [ -f "$rel/app-release.apk" ]; then
            cp "$rel/app-release.apk" "LocalChat-$v-android.apk"
          else
            cp "$rel/app-release-unsigned.apk" "LocalChat-$v-android.apk"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalChat-${{ inputs.version }}-android
          path: |
            *.apk
          if-no-files-found: error

  # ---------- 汇总发布:两个平台的产物合并进同一个 Release ----------
  release:
    if: ${{ inputs.make_release }}
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LocalChat-${{ inputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: LocalChat ${{ inputs.version }}
          fail_on_unmatched_files: true
          body: |
            本地聊天 LocalChat ${{ inputs.version }}

            Windows(x64):
            - `LocalChat-*-win-x64-portable.zip`:自包含单文件,解压即用,无需安装运行时
            - `LocalChat-*-win-x64.zip`:依赖 .NET 9 桌面运行时

            Android:
            - `LocalChat-*-android.apk`:正式版,配置签名 Secrets 后已签名,可直接安装与覆盖升级
            - `LocalChat-*-android-debug.apk`:调试签名版,可直接安装(正式签名包不可用时的备用)
          files: |
            dist/*
